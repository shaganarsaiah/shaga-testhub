<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAGA TestHub</title>

<link rel="stylesheet" href="config.css">

</head>

<body>
    <header class="sn-navbar">

    <div class="sn-container">

        <a href="../index.html" class="sn-logo">
            📘 SHAGA NOTES
        </a>

        <nav>

            <a href="../index.html">Home</a>

            <a href="../books/constitution/index.html">Handbooks</a>

            <a href="../cbt/config.html" class="active">TestHub</a>

        </nav>

    </div>

</header>

<div class="container">

<h1>🎯 SHAGA TestHub</h1>

<h2>TGPSC Dy.E.O. Practice Test</h2>

<label>Subjects</label>

<div id="subjects" class="subjects-box">

    <label>
        <input type="checkbox" value="Educational Psychology" checked>
        Educational Psychology
    </label>

    <label>
        <input type="checkbox" value="Educational Philosophy">
        Educational Philosophy
    </label>

    <label>
        <input type="checkbox" value="Educational Sociology">
        Educational Sociology
    </label>

    <label>
        <input type="checkbox" value="Educational Technology">
        Educational Technology
    </label>

    <label>
        <input type="checkbox" value="Educational Leadership">
        Educational Leadership
    </label>

    <label>
        <input type="checkbox" value="Educational Management">
        Educational Management
    </label>

    <label>
        <input type="checkbox" value="Assessment">
        Assessment
    </label>

    <label>
        <input type="checkbox" value="Teacher Education">
        Teacher Education
    </label>

    <label>
        <input type="checkbox" value="General Studies">
        General Studies
    </label>

</div>

<label>Topic</label>

<select id="topic">

<option>Growth and Development</option>

<option>Learning</option>

</select>

<label>No. of Questions</label>

<select id="questions">

<option>10</option>

<option>20</option>

<option>30</option>

<option>50</option>

<option>100</option>

</select>

<label>Difficulty</label>

<select id="difficulty">

<option>Mixed</option>

<option>Easy</option>

<option>Moderate</option>

<option>Difficult</option>

</select>

<label>Language</label>

<select id="language">

<option>English</option>

<option>Telugu</option>

</select>
<label>Time (Minutes)</label>

<<select id="time">

    <option value="10">10 Minutes</option>
    <option value="20">20 Minutes</option>
    <option value="30">30 Minutes</option>
    <option value="40">40 Minutes</option>
    <option value="50">50 Minutes</option>
    <option value="60">60 Minutes</option>
    <option value="70">70 Minutes</option>
    <option value="80">80 Minutes</option>
    <option value="90">90 Minutes</option>
    <option value="100">100 Minutes</option>
    <option value="110">110 Minutes</option>
    <option value="120">120 Minutes</option>
    <option value="130">130 Minutes</option>
    <option value="140">140 Minutes</option>
    <option value="150" selected>150 Minutes</option>

</select>

<button id="startBtn">

START TEST

</button>

</div>

<script src="config.js"></script>

</body>

</html>
